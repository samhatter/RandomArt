<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Art Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="controls">
    <h1>Random Art Generator</h1>
    
    <div class="control-group">
      <label for="depth">Tree Depth <span class="range-value" id="depth-value">3</span></label>
      <input type="range" id="depth" min="1" max="8" value="3">
    </div>

    <div class="control-group">
      <label for="max-children">Max Children <span class="range-value" id="max-children-value">2</span></label>
      <input type="range" id="max-children" min="2" max="5" value="2">
    </div>

    <div class="control-group">
      <label for="child-prob">Child Probability <span class="range-value" id="child-prob-value">0.5</span></label>
      <input type="range" id="child-prob" min="0" max="1" step="0.1" value="0.5">
    </div>

    <button id="regenerate">Generate New Art</button>
    <button id="save">Save as Image</button>

    <div class="info">
      <p>Click anywhere to regenerate art with current settings.</p>
      <p>Adjust parameters and click "Generate New Art" to see changes.</p>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="art-canvas"></canvas>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
