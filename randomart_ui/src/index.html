<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Art Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="controls">
    <h1>Random Art Generator</h1>
    
    <div class="control-group">
      <label for="config">Configuration (JavaScript)</label>
      <textarea id="config" spellcheck="false"></textarea>
    </div>

    <button id="regenerate">Generate</button>
    <button id="save">Save as Image</button>

    <div class="expression-display">
      <h3>Generated Expression:</h3>
      <div id="expression"></div>
    </div>

    <div class="info">
      <p>Edit the configuration above and click Generate.</p>
      <p>Modify functions, probabilities, depth, etc.</p>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="art-canvas"></canvas>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
